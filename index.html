
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Académicas | SENATI</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Gestor de Tareas Académicas</h1>
        <p>Proyecto colaborativo - Seminario Complementario II</p>
    </header>

    <main>
        <section id="registro">
            <h2>Registrar tarea</h2>
            <form id="formulario-tarea">
                <label for="titulo">Título de la tarea</label>
                <input type="text" id="titulo" required>

                <label for="responsable">Responsable</label>
                <input type="text" id="responsable" required>

                <button type="submit">Agregar tarea</button>
            </form>
        </section>

        <section id="listado">
            <h2>Lista de tareas</h2>
            <div id="lista-tareas"></div>
        </section>
    </main>

    <footer>
        <p>SENATI - Trabajo colaborativo con Git y GitHub</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
